<svg xmlns="http://www.w3.org/2000/svg" width="880" height="364" viewBox="0 0 880 364" role="img" aria-label="Mockup of the slash menu in an Orca Claude chat listing the fork's commands /rc, /remote-control, /orca-account and /orca-migrate">
<title>Mockup of the slash menu in an Orca Claude chat listing the fork's commands /rc, /remote-control, /orca-account and /orca-migrate</title>
<rect x="0.5" y="0.5" width="879" height="363" rx="14" fill="#0a0a0a" stroke="#2a2a2a"/>
<path d="M0.5 40 V14.5 a14 14 0 0 1 14 -14 H865.5 a14 14 0 0 1 14 14 V40 Z" fill="#121212"/>
<line x1="0.5" y1="40" x2="879.5" y2="40" stroke="#2a2a2a"/>
<circle cx="22" cy="20" r="5.5" fill="#3a3a3a"/>
<circle cx="40" cy="20" r="5.5" fill="#3a3a3a"/>
<circle cx="58" cy="20" r="5.5" fill="#3a3a3a"/>
<text x="440.0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#acacac" text-anchor="middle" font-weight="600">Claude  ·  Orca chat</text>
<rect x="28" y="66" width="824" height="224" rx="10" fill="#171717" stroke="#333"/>
<rect x="34" y="74" width="812" height="48" rx="7" fill="#262626"/>
<text x="46" y="94" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#f0f0f0" font-weight="600">/rc</tspan><tspan fill="#6b6b6b">  [on [name]|&lt;name&gt;|off|status]</tspan></text>
<text x="46" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#acacac" font-weight="400" text-anchor="start">Orca: alias for /remote-control</text>
<text x="46" y="146" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#f0f0f0" font-weight="600">/remote-control</tspan><tspan fill="#6b6b6b">  [on [name]|&lt;name&gt;|off|status]</tspan></text>
<text x="46" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#acacac" font-weight="400" text-anchor="start">Orca: turn Claude Code Remote Control on (off, status) for this chat</text>
<text x="46" y="198" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#f0f0f0" font-weight="600">/orca-account</tspan><tspan fill="#6b6b6b">  [&lt;account&gt;|auto]</tspan></text>
<text x="46" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#acacac" font-weight="400" text-anchor="start">Orca: show or pin this chat's Claude account</text>
<text x="46" y="250" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#f0f0f0" font-weight="600">/orca-migrate</tspan><tspan fill="#6b6b6b">  &lt;account&gt;|auto [--with-workers]</tspan></text>
<text x="46" y="269" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#acacac" font-weight="400" text-anchor="start">Orca: move this chat (and its workers) to another Claude account</text>
<rect x="28" y="300" width="824" height="46" rx="12" fill="#171717" stroke="#3a3a3a"/>
<text x="44" y="328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#f0f0f0" font-weight="400" text-anchor="start">/</text>
<rect x="54" y="314" width="1.5" height="18" fill="#f0f0f0"/>
</svg>
