<svg xmlns="http://www.w3.org/2000/svg" width="880" height="463" viewBox="0 0 880 463" role="img" aria-label="Mockup of an Orca Claude chat: /orca-account shows the chat account, then pins the chat to team@example.com">
<title>Mockup of an Orca Claude chat: /orca-account shows the chat account, then pins the chat to team@example.com</title>
