<text x="64" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4493f8" font-weight="600" text-anchor="start">Orca</text>
<text x="46" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#acacac" font-weight="400" text-anchor="start">This chat's Claude account: personal@example.com (follows the global selection).</text>
<text x="46" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#acacac" font-weight="400" text-anchor="start">Accounts: personal@example.com (id 3f2a…), team@example.com (id 8c41…).</text>
<text x="46" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#acacac" font-weight="400" text-anchor="start">Pin this chat with /orca-account &lt;account&gt;, unpin it with /orca-account auto; a coordinator</text>
<text x="46" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#acacac" font-weight="400" text-anchor="start">and its workers with /orca-migrate &lt;account&gt; --with-workers.</text>
