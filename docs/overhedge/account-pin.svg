<text x="599" y="294" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#f0f0f0" font-weight="400" text-anchor="start" xml:space="preserve">/orca-account team@example.com</text>
