<circle cx="58" cy="20" r="5.5" fill="#3a3a3a"/>
<text x="440.0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#acacac" text-anchor="middle" font-weight="600">Claude  ·  Orca chat</text>
