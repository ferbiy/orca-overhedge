<text x="46" y="375" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#acacac" font-weight="400" text-anchor="start" xml:space="preserve">Moved 1 chat(s) to team@example.com (8c41…):</text>
<text x="46" y="396" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#acacac" font-weight="400" text-anchor="start" xml:space="preserve">  1. chat        5e0c…  (from personal@example.com)</text>
<text x="46" y="417" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#acacac" font-weight="400" text-anchor="start">Chat-UI chats switch at their next message, after the current turn ends (same tab, same session).</text>
